<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TASSIMO BTP - Documents</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#0b1f3a;
    color:white;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:sticky;
    top:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;
    border-radius:10px;
    background:#f4b400;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
}

.brand h1{
    font-size:18px;
}

.brand small{
    display:block;
    opacity:.8;
    margin-top:3px;
}

.actions{
    display:flex;
    gap:8px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:8px;
    padding:10px 14px;
    font-weight:bold;
}

.lang{
    background:white;
    color:#0b1f3a;
}

.dashboard{
    background:#f4b400;
    color:#111;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:22px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:22px;
    flex-wrap:wrap;
}

.topbar h2{
    font-size:27px;
}

.topbar p{
    color:#667085;
    margin-top:5px;
}

.primary{
    background:#0b1f3a;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-bottom:22px;
}

.stat{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.stat span{
    color:#667085;
    font-size:13px;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:7px;
}

.toolbar{
    background:white;
    padding:15px;
    border-radius:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

input,select,textarea{
    width:100%;
    padding:11px;
    border:1px solid #d8dee9;
    border-radius:8px;
    background:white;
    font-size:14px;
}

.search{
    flex:1;
    min-width:220px;
}

.content{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,td{
    padding:13px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
}

th{
    background:#f8fafc;
    font-size:13px;
}

.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    background:#eef2ff;
}

.row-actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.row-actions button{
    padding:7px 9px;
    font-size:12px;
}

.view{
    background:#e8f1ff;
    color:#1557a6;
}

.print{
    background:#e9f8ef;
    color:#18733d;
}

.delete{
    background:#ffe9e9;
    color:#b42318;
}

.empty{
    padding:40px;
    text-align:center;
    color:#667085;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    background:white;
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:15px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    background:#eee;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.full{
    grid-column:1/-1;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

.document-preview{
    background:#f4f7fb;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#0b1f3a;
    color:white;
    padding:13px 18px;
    border-radius:8px;
    display:none;
    z-index:100;
}

@media(max-width:1000px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){

    header{
        padding:12px;
    }

    .brand h1{
        font-size:14px;
    }

    .brand small{
        font-size:10px;
    }

    .actions button{
        padding:8px;
        font-size:11px;
    }

    .container{
        padding:13px;
    }

    .topbar h2{
        font-size:22px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat strong{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }
}

</style>

</head>

<script>

let lang=localStorage.getItem("lang")||"fr";

let documents=[];

let currentDocument=null;


function $(id){
    return document.getElementById(id);
}


function tr(fr,en){
    return lang==="fr"?fr:en;
}


function applyLanguage(){

    document.documentElement.lang=lang;

    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.textContent=lang==="fr"
            ?el.dataset.fr
            :el.dataset.en;
    });

    document.querySelectorAll("[data-fr-placeholder]").forEach(el=>{
        el.placeholder=lang==="fr"
            ?el.dataset.frPlaceholder
            :el.dataset.enPlaceholder;
    });

    $("langBtn").textContent=lang==="fr"?"EN":"FR";

}


function toggleLang(){

    lang=lang==="fr"?"en":"fr";

    localStorage.setItem("lang",lang);

    applyLanguage();

    render();

}


function toast(message){

    $("toast").textContent=message;

    $("toast").style.display="block";

    setTimeout(()=>{
        $("toast").style.display="none";
    },2500);

}


async function api(url,opt={}){

    opt.headers={
        ...(opt.headers||{}),
        "Content-Type":"application/json",
        "X-Language":lang
    };

    const response=await fetch(url,opt);

    if(response.status===401){

        location.href="/login";

        return null;
    }

    let data={};

    try{
        data=await response.json();
    }catch(e){
        data={};
    }

    if(!response.ok){

        throw new Error(
            data.error||
            tr(
                "Opération impossible.",
                "Operation failed."
            )
        );

    }

    return data;

}


async function loadDocuments(){

    try{

        const data=await api("/api/documents");

        documents=data?.data||[];

        render();

    }catch(error){

        toast(error.message);

        documents=[];

        render();

    }

}


function typeLabel(type){

    const labels={
        invoice:["Facture","Invoice"],
        receipt:["Reçu","Receipt"],
        quote:["Devis","Quotation"],
        payment:["Confirmation de paiement","Payment Confirmation"],
        contract:["Contrat","Contract"],
        project:["Document de projet","Project Document"],
        delivery:["Bon de livraison","Delivery Note"],
        expense:["Justificatif de dépense","Expense Voucher"],
        certificate:["Certificat","Certificate"],
        other:["Autre","Other"]
    };

    return labels[type]
        ?labels[type][lang==="fr"?0:1]
        :type;

}


function statusLabel(status){

    const labels={
        draft:["Brouillon","Draft"],
        issued:["Émis","Issued"],
        paid:["Payé","Paid"],
        pending:["En attente","Pending"],
        cancelled:["Annulé","Cancelled"]
    };

    return labels[status]
        ?labels[status][lang==="fr"?0:1]
        :status;

}


function render(){

    const search=$("search").value.toLowerCase();

    const type=$("typeFilter").value;

    const filtered=documents.filter(d=>{

        const text=JSON.stringify(d).toLowerCase();

        return text.includes(search) &&
            (!type||d.document_type===type);

    });


    $("rows").innerHTML="";


    if(!filtered.length){

        $("rows").innerHTML=`
        <tr>
        <td colspan="6" class="empty">
        ${tr(
            "Aucun document trouvé.",
            "No documents found."
        )}
        </td>
        </tr>`;

    }else{

        filtered.forEach(d=>{

            const trEl=document.createElement("tr");

            trEl.innerHTML=`

            <td>
                <strong>${escapeHtml(
                    d.document_number||"—"
                )}</strong>
            </td>

            <td>
                <span class="badge">
                ${escapeHtml(
                    typeLabel(d.document_type)
                )}
                </span>
            </td>

            <td>
                ${escapeHtml(
                    d.customer||d.project||"—"
                )}
            </td>

            <td>
                ${escapeHtml(
                    d.document_date||"—"
                )}
            </td>

            <td>
                ${escapeHtml(
                    statusLabel(d.status)
                )}
            </td>

            <td>

                <div class="row-actions">

                    <button
                    class="view"
                    onclick='viewDocument(${JSON.stringify(d)})'>
                    ${tr("👁️ Voir","👁️ View")}
                    </button>

                    <button
                    class="print"
                    onclick='printDocument(${JSON.stringify(d)})'>
                    ${tr("🖨️ Imprimer","🖨️ Print")}
                    </button>

                    <button
                    class="delete"
                    onclick="deleteDocument('${d.id}')">
                    ${tr("🗑️ Supprimer","🗑️ Delete")}
                    </button>

                </div>

            </td>
            `;

            $("rows").appendChild(trEl);

        });

    }


    $("total").textContent=documents.length;

    $("invoices").textContent=
        documents.filter(x=>x.document_type==="invoice").length;

    $("receipts").textContent=
        documents.filter(x=>x.document_type==="receipt").length;

    $("quotes").textContent=
        documents.filter(x=>x.document_type==="quote").length;

    $("contracts").textContent=
        documents.filter(x=>x.document_type==="contract").length;

}


function escapeHtml(value){

    return String(value??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function openModal(){

    $("modal").style.display="flex";

    $("docDate").value=
        new Date().toISOString().slice(0,10);

}


function closeModal(){

    $("modal").style.display="none";

}


async function saveDocument(){

    const data={

        document_type:$("docType").value,

        document_number:$("docNumber").value.trim(),

        customer:$("docCustomer").value.trim(),

        project:$("docProject").value.trim(),

        document_date:$("docDate").value,

        amount:Number(
            $("docAmount").value||0
        ),

        status:$("docStatus").value,

        description:$("docDescription").value.trim()

    };


    if(!data.document_number){

        toast(
            tr(
                "Veuillez entrer un numéro ou une référence.",
                "Please enter a number or reference."
            )
        );

        return;

    }


    try{

        await api(
            "/api/documents",
            {
                method:"POST",
                body:JSON.stringify(data)
            }
        );

        toast(
            tr(
                "Document enregistré avec succès.",
                "Document saved successfully."
            )
        );

        closeModal();

        await loadDocuments();

    }catch(error){

        toast(error.message);

    }

}


function viewDocument(document){

    currentDocument=document;

    $("preview").innerHTML=`

    <div class="document-preview">

        <h2>
        TASSIMO BTP CONSTRUCTION SARL
        </h2>

        <p>
        Together, let us build excellence.
        </p>

        <hr><br>

        <p>
        <strong>${tr(
            "Type",
            "Type"
        )}:</strong>
        ${escapeHtml(typeLabel(
            document.document_type
        ))}
        </p>

        <p>
        <strong>${tr(
            "Référence",
            "Reference"
        )}:</strong>
        ${escapeHtml(
            document.document_number||"—"
        )}
        </p>

        <p>
        <strong>${tr(
            "Client",
            "Customer"
        )}:</strong>
        ${escapeHtml(
            document.customer||"—"
        )}
        </p>

        <p>
        <strong>${tr(
            "Projet",
            "Project"
        )}:</strong>
        ${escapeHtml(
            document.project||"—"
        )}
        </p>

        <p>
        <strong>${tr(
            "Date",
            "Date"
        )}:</strong>
        ${escapeHtml(
            document.document_date||"—"
        )}
        </p>

        <p>
        <strong>${tr(
            "Montant",
            "Amount"
        )}:</strong>
        ${Number(
            document.amount||0
        ).toLocaleString()} FCFA
        </p>

        <p>
        <strong>${tr(
            "Statut",
            "Status"
        )}:</strong>
        ${escapeHtml(
            statusLabel(document.status)
        )}
        </p>

        <br>

        <p>
        <strong>${tr(
            "Description",
            "Description"
        )}</strong>
        </p>

        <p>
        ${escapeHtml(
            document.description||""
        )}
        </p>

        <br><br>

        <p>
        TASSIMO BTP CONSTRUCTION SARL
        </p>

    </div>
    `;

    $("viewModal").style.display="flex";

}


function closeView(){

    $("viewModal").style.display="none";

    currentDocument=null;

}


function printCurrent(){

    if(currentDocument){

        printDocument(currentDocument);

    }

}


function printDocument(document){

    const printWindow=window.open(
        "",
        "_blank"
    );

    if(!printWindow){

        toast(
            tr(
                "Autorisez les fenêtres pop-up pour imprimer.",
                "Allow pop-ups to print."
            )
        );

        return;

    }


    const title=typeLabel(
        document.document_type
    );


    printWindow.document.write(`

async function deleteDocument(id){

    if(!confirm(
        tr(
            "Voulez-vous vraiment supprimer ce document ?",
            "Do you really want to delete this document?"
        )
    )){
        return;
    }


    try{

        await api(
            "/api/documents?id="+
            encodeURIComponent(id),
            {
                method:"DELETE"
            }
        );

        toast(
            tr(
                "Document supprimé.",
                "Document deleted."
            )
        );

        await loadDocuments();

    }catch(error){

        toast(error.message);

    }

}


applyLanguage();

loadDocuments();

</script>
